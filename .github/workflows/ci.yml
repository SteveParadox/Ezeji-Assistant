name: Ezeji application checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check server/staffRoutes.js
      - run: node --check server/whatsappConnections.js
      - run: npm run lint
      - run: npm test
      - run: npm run build
