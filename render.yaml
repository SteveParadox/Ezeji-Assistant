services:
  - type: web
    name: ezeji-assistant-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        generateValue: false

  - type: cron
    name: ezeji-billing-maintenance
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/billing-maintenance.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and
      # PAYSTACK_SECRET_KEY as dashboard-managed secret values.

  - type: worker
    name: ezeji-whatsapp-worker
    runtime: node
    buildCommand: npm ci
    startCommand: node scripts/whatsapp-worker.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Configure SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
      # WHATSAPP_TOKEN_ENCRYPTION_KEY, GROQ_API_KEY, GROQ_MODEL
      # and WHATSAPP_GRAPH_VERSION as dashboard-managed settings.

  - type: cron
    name: ezeji-assistant-maintenance
    runtime: node
    schedule: "* * * * *"
    buildCommand: npm ci
    startCommand: node scripts/assistant-maintenance.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are dashboard secrets.
